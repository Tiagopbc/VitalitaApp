name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
          
      - name: Install Dependencies
        run: npm ci

      - name: Install Functions Dependencies
        run: npm ci --prefix functions

      # Raiz em `critical`, não `high`: o @firebase/firestore fixa
      # @grpc/grpc-js em ~1.9.0 até na versão mais nova, e os avisos high
      # do grpc-js (GHSA-m9gg-hp2v-232j, GHSA-f596-whhp-79r4) são do lado
      # servidor do gRPC — o bundle do navegador nem usa o grpc-js. Voltar
      # para `high` quando o Firebase subir a dependência.
      - name: Audit Dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Audit Functions Dependencies
        run: npm audit --omit=dev --audit-level=high --prefix functions
        
      - name: Run Lint
        run: npm run lint

      - name: Run Knip
        run: npm run knip

      - name: Run Vitest
        run: npm test -- --run

      - name: Run Functions Tests
        run: npm --prefix functions test

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Run Firestore Rules Tests
        run: npm run test:rules

      - name: Run Build
        run: npm run build

      - name: Run Test Coverage
        run: npm run test:coverage
