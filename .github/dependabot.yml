# Majors pendentes entram um por vez, cada um no seu PR — o grupo minor-e-patch
# junta só minor e patch. PR de npm que mexe no lockfile precisa ter sido gerado
# com npm 11 (ver "Node 24 + npm 11" no CLAUDE.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Par que não sobe separado. Fica antes do minor-e-patch porque o
      # Dependabot põe cada dependência no primeiro grupo que casar: o
      # coverage-v8 exige a mesma versão do vitest.
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      minor-e-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-e-patch:
        update-types: [minor, patch]
