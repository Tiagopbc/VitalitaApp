<!doctype html>
<html lang="en">

<head>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta charset="UTF-8" />
  <link rel="preload" href="/fonts/Inter-400-normal-15.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/Outfit-600-normal-52.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/Outfit-700-normal-54.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="icon" type="image/png" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!--
    `black`, e desta vez é definitivo. Não volte para `black-translucent`.

    Com `black-translucent` o conteúdo passa por baixo da status bar, e o iOS
    aplica dois efeitos próprios em quem entra nessa faixa: um esfumaçado e um
    escurecimento (para o relógio branco continuar legível sobre qualquer cor).
    Não são opcionais e nenhum CSS os desliga.

    Duas tentativas de conviver com isso falharam, ambas verificadas no aparelho:

    1. Corrigir do lado do app. Cinco hipóteses testadas com painel de A/B —
       backdrop-filter aninhado, pixel fracionário, camada de composição,
       suavização de fonte e o gradiente "ambient glow". Todas caíram. Efeito de
       sistema não se conserta com CSS.

    2. `StatusBarCap`, uma tampa opaca cobrindo a área segura (#72). Falhou por
       dois motivos: a região afetada não coincide com `env(safe-area-inset-top)`,
       e a barra de aviso vive em z-10000, acima de qualquer tampa — ela saía com
       o topo escurecido, ou seja, o full-bleed que a tampa existia para preservar
       já vinha degradado.

    Com `black`, o iOS pinta a faixa e o conteúdo começa abaixo dela.
    `env(safe-area-inset-top)` vira 0 e os layouts se ajustam sozinhos, porque
    todos usam `env()`.

    ATENÇÃO ao entregar: o iOS lê esta tag ao **montar a janela do app**, não a
    cada carregamento. Um "Atualizar Agora" faz skipWaiting + reload dentro da
    janela já montada e NÃO aplica a troca. É preciso matar o app no seletor e
    reabrir — ou, se nem isso bastar, remover o ícone e adicionar de novo. Custo
    de uma vez só: é a única categoria de mudança que não chega sozinha, e todo o
    resto (código, CSS, manifesto, assets) continua chegando pelo service worker.
  -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <title>Vitalità</title>
  <meta name="theme-color" content="#0f172a" />
</head>

<body>
  <div id="root">
    <div
      id="initial-loader"
      role="status"
      aria-live="polite"
      style="
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #020617;
        color: #e2e8f0;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        font-size: 14px;
      "
    >
      <div style="text-align: center; padding: 24px;">
        <div style="font-size: 20px; font-weight: 700; letter-spacing: 0.2em; margin-bottom: 6px;">
          VITALITÀ
        </div>
        <p style="font-size: 15px; color: #94a3b8; margin: 0;">
          Seu diário inteligente de treinos
        </p>
        <div
          style="
            margin: 14px auto 0;
            width: 28px;
            height: 28px;
            border: 2px solid rgba(14, 165, 233, 0.3);
            border-top-color: #0ea5e9;
            border-radius: 999px;
            animation: initial-loader-spin 1s linear infinite;
          "
        ></div>
        <div style="margin-top: 6px; font-size: 12px; color: #64748b;">
          Carregando...
        </div>
      </div>
      <style>
        @keyframes initial-loader-spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
